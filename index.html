<!DOCTYPE html>
<html lang="en" data-theme="standard">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OmniPath Nutrition</title>
    <link rel="manifest" href="/manifest.json" />
    <!-- Apply the saved theme before first paint so there's no flash of the wrong theme -->
    <script>
      try {
        var t = localStorage.getItem('omnipath.theme');
        if (t && ['standard', 'pretty', 'manly', 'beach', 'circus'].indexOf(t) !== -1) {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    </script>
    <!-- Theme fonts (fall back to system fonts when offline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bungee&family=Dancing+Script:wght@700&family=Fredoka:wght@400;500;600&family=Inter:wght@400;600;800&family=Nunito:wght@400;700;800&family=Oswald:wght@500;700&family=Pacifico&family=Quicksand:wght@400;600;700&family=Roboto+Condensed:wght@400;700&display=swap"
    />
  </head>
  <body class="bg-[var(--bg-primary)] text-[var(--text-main)] min-h-screen transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
